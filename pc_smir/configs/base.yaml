seed: 42

data:
  city: beijing
  data_dir: data/beijing
  download: true
  max_len: 20
  spatial_cell_size_m: 500
  # null => full training catalog softmax; int => sampled softmax negatives
  train_neg_samples: 64

surd:
  estimator: mmi_pid_discrete_v1
  n_clusters: 6
  hour_bins: 8
  alpha: 0.5
  min_positive: 2
  kappa: 10.0
  n_bootstrap: 3
  n_folds: 4
  temporal_crossfit: true
  clip: 5.0
  pairs:
    - [Q1, Q2]
    - [Q1, Q3]
    - [Q1, Q4]
    - [Q2, Q3]
    - [Q2, Q4]
    - [Q3, Q4]
  triples:
    - [Q1, Q2, Q3]
    - [Q1, Q3, Q4]

model:
  d: 64
  meta_dim: 5
  stable_dim: 8
  dropout: 0.1
  use_bilinear: true
  router_temperature: 1.0
  ablation: full  # full | uniform | no_surd | concat_mlp
  pairs:
    - [0, 1]
    - [0, 2]
    - [0, 3]
    - [1, 2]
    - [2, 3]
  triples:
    - [0, 1, 2]
    - [0, 2, 3]

train:
  batch_size: 8
  eval_batch_size: 4
  # Full Beijing/Tokyo runs: allow enough epochs; early-stop via patience.
  epochs: 80
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 5.0
  # Stop after this many non-improving val epochs (trainer.fit).
  patience: 15
  select_metric: recall@10
  loss: ce
  temperature: 1.0
  entropy_coef: 0.0

# STHGCN-aligned evaluation protocol (default false = legacy trail-prefix eval).
# When eval.sthgcn_protocol is true (prepare + val/test example construction):
#   1) remove_unseen_user_poi — drop the whole val/test sample if the user never
#      appeared in train OR the target POI never appeared in train.
#   2) Unseen POIs in the trajectory *prefix* (history before target) map to a
#      single UNK/OOV embedding id (vocab OOV_ID=1); do not drop the sample solely
#      for history OOV.
#   3) Val/test history may use all of the user's check-ins with time before the
#      target event (cross-trail temporal visibility), matching STHGCN's
#      before-target visibility — not only the same-trail prefix.
# Train examples stay same-trail prefixes. Toggle requires prepare rebuild
# (auto when prep_meta.sthgcn_protocol differs, or pass --force).
eval:
  sthgcn_protocol: false

output:
  artifact_dir: artifacts/beijing
  run_dir: outputs/beijing