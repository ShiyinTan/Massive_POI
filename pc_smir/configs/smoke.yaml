# Tiny run for CI / local sanity
seed: 0
data:
  city: beijing
  data_dir: data/beijing
  download: true
  max_len: 12
  train_neg_samples: 32
surd:
  n_clusters: 4
  n_bootstrap: 2
  n_folds: 3
  min_positive: 1
model:
  d: 32
  dropout: 0.0
  ablation: full
train:
  batch_size: 4
  eval_batch_size: 4
  # Intentionally short for CI / local sanity (full train: base + model_pcsmir → 80 / 15).
  epochs: 1
  patience: 1
  lr: 0.002
output:
  artifact_dir: artifacts/beijing_smoke
  run_dir: outputs/beijing_smoke