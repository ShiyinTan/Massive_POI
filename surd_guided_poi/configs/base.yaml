seed: 42
device: null  # null -> auto cuda/cpu
output_dir: outputs/default

data:
  city: beijing
  # Directory containing Massive-STEPS official split CSVs:
  #   {city}_checkins_train.csv / _validation.csv / _test.csv
  # If null, tries Massive-STEPS/data/{city}/ then HuggingFace download.
  data_dir: null
  hf_dataset_id: CRUISEResearchGroup/Massive-STEPS-Beijing
  cache_dir: outputs/data_cache
  # Official Massive-STEPS protocol (trail-level, user-stratified). Do not replace
  # with a custom global temporal split.
  split_protocol: massive_steps_official
  # From official train only: holdout for MI/SURD estimation (cross-fitting).
  estimator_holdout_ratio: 0.2
  # History window: truncate to last N (NOT “drop users with <20 check-ins”).
  # 历史窗口截断长度，不是按用户总打卡数过滤。
  # 50：比上游 Flashback CLI 默认 sequence_length=20 更长，仍适合 pack + batch 32–64。
  max_history_len: 50
  # Per-trail: need ≥ min_history_len history steps → trail length ≥ min_history_len+1.
  min_history_len: 1
  # Flashback trains on all prefixes; Massive-STEPS LLM eval often uses last only.
  use_all_prefixes: true
  setting: transductive

model:
  # flashback | graph_flashback | sthgcn
  backbone: flashback
  hidden_dim: 64
  poi_emb_dim: 64  # ignored when share_poi_embedding=true (backbone emb dim = hidden_dim)
  num_layers_history: 1
  dropout: 0.1
  subset_hidden_dim: 64
  rnn_type: gru
  # Flashback / Graph-Flashback spatiotemporal decay
  lambda_t: 0.1
  lambda_s: 100.0
  share_poi_embedding: true
  # Graph-Flashback: optional KGE pkls; else count-graphs from official train
  # transition_pkl: null
  # interact_pkl: null
  lambda_loc: 1.0
  lambda_user: 1.0
  use_weight: false
  use_graph_user: false
  use_spatial_graph: false
  # STHGCN sequential Transformer (NextPOIBatch adapter; full hypergraph needs PyG)
  sthgcn_num_layers: 2
  sthgcn_num_heads: 4
  # sthgcn_ff_dim: null  # default max(128, 2*hidden_dim)

train:
  batch_size: 64
  num_workers: 0
  lr: 0.001
  weight_decay: 0.00001
  warmup_epochs: 5
  total_epochs: 40
  # Optional MultiStepLR (Flashback uses [20,40,60,80] × 0.2); empty = no schedule
  lr_milestones: []
  lr_gamma: 0.2
  surd_refresh_interval: 5
  # SURD aux: set use_surd=false or lambda_*=0 to train Flashback-only
  use_surd: true
  lambda_u: 0.5
  lambda_s: 0.5
  ema_beta: 0.5
  grad_clip: 5.0
  subset_fit_epochs: 5
  subset_fit_lr: 0.001
  log_every: 50

surd:
  eps: 1.0e-12
  min_poi_samples: 3
  shrink_kappa: 10.0
  units: nats

eval:
  ks: [1, 5, 10]
  frequency_buckets: [0.2, 0.5]
  # 每个 train epoch 后必跑 val；test 可选（略慢，默认开以便对照）
  eval_test_every_epoch: true
  # Massive-STEPS Flashback Acc@1 协议：val/test 只评每条 trail 的最后一站
  # （train 仍可用 data.use_all_prefixes=true）。Acc@1 ≡ recall@1。
  use_all_prefixes: false
  best_metric: recall@1