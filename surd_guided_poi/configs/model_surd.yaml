# Enable SURD aux on top of Flashback. For Acc@1 parity with Massive-STEPS
# Flashback first, prefer model_flashback_aligned.yaml (use_surd=false).
model:
  backbone: flashback
  hidden_dim: 64
  subset_hidden_dim: 64
  rnn_type: gru
  lambda_t: 0.1
  lambda_s: 100.0
  share_poi_embedding: true

train:
  use_surd: true
  lambda_u: 0.1
  lambda_s: 0.1
  ema_beta: 0.5
  surd_refresh_interval: 5
  subset_fit_epochs: 5

surd:
  min_poi_samples: 3
  shrink_kappa: 10.0
  units: nats