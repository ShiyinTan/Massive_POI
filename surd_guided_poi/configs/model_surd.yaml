model:
  backbone: flashback
  hidden_dim: 64
  subset_hidden_dim: 64
  rnn_type: gru
  lambda_t: 0.1
  lambda_s: 100.0
  share_poi_embedding: true

train:
  lambda_u: 0.5
  lambda_s: 0.5
  ema_beta: 0.5
  surd_refresh_interval: 3
  subset_fit_epochs: 3

surd:
  min_poi_samples: 3
  shrink_kappa: 10.0
  units: nats