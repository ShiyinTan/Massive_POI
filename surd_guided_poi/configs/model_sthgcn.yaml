# Full hypergraph STHGCN baseline (Massive-STEPS Spatio-Temporal-Hypergraph-Model).
# Requires PyG stack: see requirements-sthgcn.txt
#
# train.py routes backbone=sthgcn to NeighborSampler path (SURD off).
# Official CSVs are materialized under
#   Massive-STEPS/Spatio-Temporal-Hypergraph-Model/data/{city}/
# then upstream preprocess + LBSNDataset + STHGCN.
#
# Massive-STEPS README Beijing Acc@1: STHGCN = 0.453 (this path).
# Deprecated local Transformer: model.backbone=sthgcn_seq (do not use for baselines).

model:
  backbone: sthgcn
  sthgcn_conf: std_conf/beijing.yml
  # Optional neighbor sizes override, e.g. "50-30" for CPU smoke (default from yml: 400-240)
  # sthgcn_sizes: null
  share_poi_embedding: false

data:
  max_history_len: 20
  use_all_prefixes: true

train:
  batch_size: 16
  eval_batch_size: 64
  lr: 0.0001
  weight_decay: 0.0
  warmup_epochs: 0
  total_epochs: 20
  valid_steps: 200
  max_steps: 100000
  use_surd: false
  lambda_u: 0.0
  lambda_s: 0.0
  surd_refresh_interval: 1000
  subset_fit_epochs: 1
  grad_clip: 5.0

eval:
  use_all_prefixes: false
  drop_unseen_user_poi: true
  best_metric: recall@1
  eval_test_every_epoch: true
  ks: [1, 5, 10]
