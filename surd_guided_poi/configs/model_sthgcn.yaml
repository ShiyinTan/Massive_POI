# STHGCN sequential baseline inside surd_guided_poi (NextPOIBatch adapter).
# Ports the SequentialTransformer idea from
# Massive-STEPS/Spatio-Temporal-Hypergraph-Model (POI/time emb + Transformer).
# Full hypergraph STHGCN still needs torch_geometric — use upstream run.py.

model:
  backbone: sthgcn
  hidden_dim: 64
  subset_hidden_dim: 64
  dropout: 0.1
  share_poi_embedding: true
  sthgcn_num_layers: 2
  sthgcn_num_heads: 4
  # sthgcn_ff_dim: 128

data:
  max_history_len: 20
  use_all_prefixes: true

train:
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  warmup_epochs: 0
  total_epochs: 40
  use_surd: false
  lambda_u: 0.0
  lambda_s: 0.0
  surd_refresh_interval: 1000
  subset_fit_epochs: 1
  grad_clip: 5.0

eval:
  use_all_prefixes: false
  best_metric: recall@1
  eval_test_every_epoch: true
  ks: [1, 5, 10]
