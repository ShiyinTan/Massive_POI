# City overlay for Tokyo.
data:
  city: tokyo
  hf_dataset_id: CRUISEResearchGroup/Massive-STEPS-Tokyo
  hf_filename: tokyo_checkins.csv
  max_history_len: 20
  use_all_prefixes: true

train:
  batch_size: 64
  warmup_epochs: 2
  total_epochs: 10
  surd_refresh_interval: 3

output_dir: outputs/tokyo