# City overlay for Beijing (small; good smoke / first run).
data:
  city: beijing
  hf_dataset_id: CRUISEResearchGroup/Massive-STEPS-Beijing
  hf_filename: beijing_checkins.csv
  max_history_len: 20
  use_all_prefixes: true

train:
  batch_size: 32
  warmup_epochs: 1
  total_epochs: 6
  surd_refresh_interval: 2

output_dir: outputs/beijing