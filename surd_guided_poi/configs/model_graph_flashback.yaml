# Massive-STEPS Graph-Flashback parity (SURD off).
# Source: Massive-STEPS/Graph-Flashback/setting.py + run_train.sh.
#
# Protocol (same as Flashback): no cold drop; train prefixes; eval last-only;
# same-split history. Graphs: prefer KGE pkls (run_train.sh) for Acc parity;
# otherwise count-graphs from official train (fallback — Acc may be lower).
#
# Massive-STEPS README Beijing Acc@1: Graph-Flashback = 0.304
# Requires city KGE pickles, e.g.:
#   transition_pkl: Massive-STEPS/Graph-Flashback/POI_graph/beijing_scheme2_transe_loc_temporal_20.pkl
#   interact_pkl:   Massive-STEPS/Graph-Flashback/POI_graph/beijing_scheme2_transe_user-loc_20.pkl

model:
  backbone: graph_flashback
  hidden_dim: 10
  subset_hidden_dim: 10
  rnn_type: rnn
  dropout: 0.0
  lambda_t: 0.1
  lambda_s: 100.0
  lambda_loc: 1.0
  lambda_user: 1.0
  use_weight: false
  use_graph_user: false
  use_spatial_graph: false
  share_poi_embedding: true
  # transition_pkl: null
  # interact_pkl: null

data:
  max_history_len: 20
  use_all_prefixes: true

train:
  batch_size: 10  # Graph-Flashback run_train.sh beijing
  lr: 0.01
  weight_decay: 0.0
  warmup_epochs: 0
  total_epochs: 100
  lr_milestones: [20, 40, 60, 80]
  lr_gamma: 0.2
  use_surd: false
  lambda_u: 0.0
  lambda_s: 0.0
  surd_refresh_interval: 1000
  subset_fit_epochs: 1
  grad_clip: 5.0

eval:
  use_all_prefixes: false
  drop_unseen_user_poi: false
  best_metric: recall@1
  eval_test_every_epoch: true
  ks: [1, 5, 10]
