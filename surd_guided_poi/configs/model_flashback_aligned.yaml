# Align recommendation backbone with Massive-STEPS/Flashback defaults
# (setting.py + run_train.sh). SURD aux off by default so Acc@1 matches
# Flashback; turn on with train.use_surd / lambda_u|lambda_s > 0.
#
# Massive-STEPS README Beijing Acc@1:
#   Flashback = 0.278   Graph-Flashback = 0.304
# Our metric Acc@1 ≡ recall@1 (single-label next-POI).

model:
  backbone: flashback
  hidden_dim: 10
  subset_hidden_dim: 10
  rnn_type: rnn
  dropout: 0.0
  lambda_t: 0.1
  lambda_s: 100.0
  share_poi_embedding: true

data:
  # Flashback CLI sequence_length default
  max_history_len: 20
  # Train on all prefixes (≈ multi-step CE coverage); eval is last-only.
  use_all_prefixes: true

train:
  batch_size: 64
  lr: 0.01
  weight_decay: 0.0
  warmup_epochs: 0
  total_epochs: 100
  # Flashback MultiStepLR milestones
  lr_milestones: [20, 40, 60, 80]
  lr_gamma: 0.2
  # SURD optional — off for Flashback parity
  use_surd: false
  lambda_u: 0.0
  lambda_s: 0.0
  surd_refresh_interval: 1000
  subset_fit_epochs: 1
  grad_clip: 5.0

eval:
  # Massive-STEPS Flashback Evaluation: one prediction = last POI of each trail
  use_all_prefixes: false
  # Early-stop / best checkpoint on Acc@1 (= recall@1), same as Flashback
  best_metric: recall@1
  eval_test_every_epoch: true
  ks: [1, 5, 10]
