# Massive-STEPS Flashback parity (SURD off).
# Source: Massive-STEPS/Flashback/setting.py + run_train.sh (Beijing batch-size 10).
#
# Protocol aligned with upstream Flashback:
#   - no cold user/POI drop (transductive vocab)
#   - train: all prefixes; eval: last-POI-only
#   - same-split trail history before target
#
# Massive-STEPS README Beijing Acc@1: Flashback = 0.278
# Our Acc@1 ≡ recall@1. Prior smoke on cached Beijing CSVs: Acc@1 ≈ 0.2783.

model:
  backbone: flashback
  hidden_dim: 10
  subset_hidden_dim: 10
  rnn_type: rnn
  dropout: 0.0
  lambda_t: 0.1
  lambda_s: 100.0
  share_poi_embedding: true

data:
  max_history_len: 20
  use_all_prefixes: true

train:
  # Flashback run_train.sh uses --batch-size 10 for beijing, 100 otherwise.
  batch_size: 10
  lr: 0.01
  weight_decay: 0.0
  warmup_epochs: 0
  total_epochs: 100
  lr_milestones: [20, 40, 60, 80]
  lr_gamma: 0.2
  use_surd: false
  lambda_u: 0.0
  lambda_s: 0.0
  surd_refresh_interval: 1000
  subset_fit_epochs: 1
  grad_clip: 5.0

eval:
  use_all_prefixes: false
  drop_unseen_user_poi: false
  best_metric: recall@1
  eval_test_every_epoch: true
  ks: [1, 5, 10]
